name = "hermes"
compatibility_date = "2024-09-23"

# All Ammoura infrastructure (ammoura.me zone, D1, R2, Workers) lives in the
# "David Monaghan" account. Pinned so non-interactive deploys work — wrangler
# cannot pick between the six accounts this login can see.
account_id = "7170285216abcab51100eea6730677aa"

# Workers deployment with static assets (migrated from Cloudflare Pages —
# tenancy plan §8). `wrangler deploy` after `npm run build`.
#
# `main` stays the adapter's own output path — adapter-cloudflare v7 WRITES to
# whatever `main` names, so pointing this at a hand-written file silently
# overwrites that file on the next build.
#
# The scheduled() handler the adapter does not emit is added after the build
# instead: `npm run build` runs scripts/wrap-worker.js, which moves the
# adapter's output aside and puts the wrapper (worker/entry.js) here in its
# place. That is what lets the Cron Triggers below reach the job registry.
# See docs/SCHEDULED_JOBS.md.
main = ".svelte-kit/cloudflare/_worker.js"

# Cron Triggers. Every expression here must be claimed by a job in
# src/lib/server/scheduler/registry.ts, and every cron a job names must appear
# here — registry.test.ts reads this file and asserts both directions, so the
# two cannot drift.
[triggers]
crons = [
  # Fulfillment retry sweep. Was a GitHub Actions workflow curling an
  # endpoint until issue #114.
  "*/10 * * * *"
]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[vars]
# Wildcard domain for free platform subdomains (slug.<domain>).
# NOTE: these [vars] reach `vite dev` through the adapter's platformProxy,
# so .dev.vars must override this to `localhost` for local dev
# (see .dev.vars.example).
PLATFORM_SITES_DOMAIN = "ammoura.me"

# Secrets (set with `wrangler secret put <NAME>`, never in [vars]):
#   PLATFORM_ENGINEER_EMAIL — the user with this email is elevated to
#     platform_engineer on their next sign-in. This is how the first superuser
#     is created; nothing is seeded. See docs/AUTHENTICATION_SETUP.md.
#   ENCRYPTION_KEY — encrypts stored provider credentials.
#   CRON_SECRET — bearer token for POST /api/cron/run, which runs registered
#     jobs by hand. It is NOT how the schedule works: Cron Triggers above call
#     the Worker's own scheduled() handler, which authenticates in-process.
#     Optional, and only worth setting if operators need to force a job.
#     See docs/SCHEDULED_JOBS.md.
# For local development put them in .dev.vars (see .dev.vars.example).

# Tenancy (see Ammoura planning repo, plans/tenancy.md)
# PLATFORM_SITES_DOMAIN: wildcard domain for free platform subdomains
#   (slug.<domain>). Unset locally → defaults to `localhost`, so sites are
#   reachable at http://<slug>.localhost:4236 in dev.
# SITE_ROUTES (optional KV binding): hostname → site id route cache. Create
#   with `wrangler kv namespace create SITE_ROUTES`, then add:
#   [[kv_namespaces]]
#   binding = "SITE_ROUTES"
#   id = "<namespace-id>"
# Routing works without it (direct D1 lookups per request).

# D1 Database Configuration
# Production database
[[d1_databases]]
binding = "DB"
database_name = "hermes-db"
database_id = "2e952313-eb3d-4a77-914f-828a112a317b"
preview_database_id = "a60090e4-72b8-4101-a4f2-83d19c4b6266"
migrations_dir = "migrations"

# Preview environment configuration
[env.preview]
name = "hermes-preview"

# No scheduled work in preview. An environment that shares nothing with
# production must not be retrying production's fulfillment relays, and an
# unset [triggers] does not inherit the top-level one — this is explicit so
# the intent is readable rather than inferred.
[env.preview.triggers]
crons = []

# Preview database
[[env.preview.d1_databases]]
binding = "DB"
database_name = "hermes-db-preview"
database_id = "a60090e4-72b8-4101-a4f2-83d19c4b6266"
migrations_dir = "migrations"

# Preview R2 bucket (use same bucket for both dev and remote in preview env)
[[env.preview.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hermes-media-preview"
preview_bucket_name = "hermes-media-preview"

# R2 Storage Configuration for media files (production)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hermes-media"
preview_bucket_name = "hermes-media-preview"


# ---------------------------------------------------------------------------
# dev-staging — a production-shaped environment for the `dev-staging` branch.
#
# Same Workers runtime, same adapter output and the same migrations as
# production, but on its own D1 and its own R2 bucket, so a bad migration or a
# test order can never touch `hermes-db` / `hermes-media`.
#
#   npm run deploy:dev-staging      # migrate + build + deploy
#
# See docs/DEV_STAGING.md.
# ---------------------------------------------------------------------------
[env.dev-staging]
name = "hermes-dev-staging"

# Staging runs no scheduled jobs, for the same reason preview does not: it has
# its own D1 and its own R2, and a sweep here would act on test orders with
# real provider credentials.
[env.dev-staging.triggers]
crons = []

[env.dev-staging.vars]
# The staging host is its own platform domain, not a slug under ammoura.me.
# If this stayed "ammoura.me", site-routing.ts would read the hostname as the
# tenant slug `dev-staging-e2ab5e` (site-routing.ts §platform-subdomain path).
# Tenant sites on staging are therefore slug.dev-staging-e2ab5e.ammoura.me —
# reachable, but Universal SSL only covers one wildcard level (*.ammoura.me),
# so those need an explicit cert before they serve HTTPS.
PLATFORM_SITES_DOMAIN = "dev-staging-e2ab5e.ammoura.me"

# Custom domain: wrangler creates and owns the proxied DNS record on the
# ammoura.me zone, and issues the edge certificate.
[[env.dev-staging.routes]]
pattern = "dev-staging-e2ab5e.ammoura.me"
custom_domain = true

[[env.dev-staging.d1_databases]]
binding = "DB"
database_name = "hermes-db-dev-staging"
database_id = "aa7a1a2c-a63b-4f60-8e3b-dbe8c53dc9c4"
migrations_dir = "migrations"

[[env.dev-staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hermes-media-dev-staging"
preview_bucket_name = "hermes-media-dev-staging"
